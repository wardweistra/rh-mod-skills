- id: table-2
  title: Table 2
  elements:
  - id: row-1
    display: row-1
    path: table-2.row-1
    datatype: unknown
    cardinality: unknown
    provenance:
      source: encr-recommendation-standard-dataset-mar2023
      sheet: Table 2
      row: 1
      columns:
        id:
        category:
        label:
    notes:
      Type of cancer: Solid cancers in adults
      Recommended stage variables: TNM classification of malignant tumours 
        (UICC)
      Remarks: This includes (y)cTNM and (y)pTNM (if applicable) Essential TNM 
        may be an alternative for poorly resourced registries FIGO stage for 
        gynaecological tumours is optional A registry should keep record which 
        edition of the TNM classification was used for which incidence year
  - id: row-2
    display: row-2
    path: table-2.row-2
    datatype: unknown
    cardinality: unknown
    provenance:
      source: encr-recommendation-standard-dataset-mar2023
      sheet: Table 2
      row: 2
      columns:
        id:
        category:
        label:
    notes:
      Type of cancer: Solid cancers in adults for which TNM is not applicable 
        (excluding tumours of the central nervous system)
      Recommended stage variables: Extent of disease
      Remarks: 'Extent of disease should be classified as follows: Localized disease
        Locally advanced disease (invasion of neighbouring organs) Regional disease
        (spread of the tumour to regional lymph nodes) Metastatic disease'
  - id: row-3
    display: row-3
    path: table-2.row-3
    datatype: unknown
    cardinality: unknown
    provenance:
      source: encr-recommendation-standard-dataset-mar2023
      sheet: Table 2
      row: 3
      columns:
        id:
        category:
        label:
    notes:
      Type of cancer: Paediatric tumours
      Recommended stage variables: Tier 2 of the Toronto consensus principles 
        and guidelines
      Remarks: Tier 1 may be an alternative for poorly resourced registries
  - id: row-4
    display: row-4
    path: table-2.row-4
    datatype: unknown
    cardinality: unknown
    provenance:
      source: encr-recommendation-standard-dataset-mar2023
      sheet: Table 2
      row: 4
      columns:
        id:
        category:
        label:
    notes:
      Type of cancer: Lymphoma
      Recommended stage variables: Lugano classification
      Remarks: The Lugano classification is an updated version of the Ann Arbor 
        classification
  - id: row-5
    display: row-5
    path: table-2.row-5
    datatype: unknown
    cardinality: unknown
    provenance:
      source: encr-recommendation-standard-dataset-mar2023
      sheet: Table 2
      row: 5
      columns:
        id:
        category:
        label:
    notes:
      Type of cancer: Haematological malignancies
      Recommended stage variables: International prognostic scoring systems
      Remarks: The scoring system is different for each haematological 
        malignancy. For example, the IPI-score for diffuse large B-cell lymphoma
        requires information on age, Ann Arbor stage, performance status, serum 
        LDH and extranodal involvement.
