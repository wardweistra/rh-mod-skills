# L2 logical model written by `rh-mod-skills specify implement`
# Path: models/<id>/structured/logical-model.yaml
schema_version: "2.0"

structure:
  model: string
  entities:                        # Epic A single-tree layout
    - id: string
      title: string
      elements:
        - id: string
          display: string
          path: string
          datatype: string          # recognized FHIR type or "unknown"
          cardinality: string       # n..m / n..* or "unknown"
          issues: list              # unknown-datatype, unknown-cardinality
          status: string            # mapped | unbound (optional on draft)
          mappings:                 # copy from bindings 2.0
            - system: string
              code: string
              display: string
              decision: string
          value_set:                # null OR authored {strength, concepts[]} from bindings
          reason: string            # required if unbound
          provenance:
            source: string
            sheet: string
            row: integer
            columns:
              id: string
              category: string
              label: string
  # logical_models: reserved for Epic B (multi-LM regroup); not required in Epic A

forbidden:
  - nested binding singleton (system/code/strength as sole coding)
  - StructureDefinition
  - invented codes
  - codebook letters F/A as datatype
