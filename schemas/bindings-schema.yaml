# L2 bindings written by `rh-mod-skills annotate implement`
# Path: models/<id>/structured/bindings.yaml
schema_version: "2.0"

structure:
  model: string
  bindings:
    - path: string                 # inventory path (unique key)
      id: string
      display: string              # inventory display (untrusted)
      status: string               # mapped | unbound
      mappings:                    # 0..*; ≤1 code per system URI; no strength
        - system: string           # FHIR system URI
          code: string
          display: string
          decision: string         # accept | replace
      value_set: null              # reserved (US2); object or null
      reason: string               # required if unbound

key: path

forbidden:
  - root-level system/code/strength/display_term as the binding coding (1.0 shape)
  - invented codes without ReasonHub or reviewer chosen
  - StructureDefinition
