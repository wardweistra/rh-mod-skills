[project]
name = "rh-mod-skills"
version = "0.1.0"
description = "Agentic toolset for turning source data models and codebooks into FHIR logical models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "ruamel.yaml>=0.18",
]

[project.scripts]
rh-mod-skills = "rh_mod_skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_mod_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills/.curated" = "rh_mod_skills/skills"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
# End users install with: uv tool install rh-mod-skills
# Dev setup: uv sync && uv run rh-mod-skills --help

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
